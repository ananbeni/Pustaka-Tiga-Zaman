
media:
  input: media
  output: /media
  

content:
  - name: berita
    label: Berita PUSTAKA TIGA ZAMAN
    type: collection
    path: berita
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      fields:
        - title
        - date
        - category
      sort:
        - date
      order: desc
    fields:
      - name: title
        label: Judul berita
        type: string
        required: true
      - name: date
        label: Tanggal berita
        type: date
        required: true
      - name: category
        label: Kategori
        type: string
        required: true
      - name: description
        label: Ringkasan berita
        type: text 
      - name: image
        label: Foto utama
        type: image
        options:
          extensions:
            - jpg
            - jpeg
            - png
            - webp


      - name: image_tengah
        label: Foto tengah berita (opsional)
        type: image
        options:
          extensions:
            - jpg
            - jpeg
            - png
            - webp


      - name: body
        label: Isi berita
        type: rich-text
        
